services:
  - type: web
    name: scholarship-hub-api
    runtime: python
    plan: free
    buildCommand: pip install -r scholarship-hub-backend/requirements.txt
    startCommand: uvicorn scholarhub.api:app --host 0.0.0.0 --port $PORT --app-dir scholarship-hub-backend/src
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ADMIN_KEY
        generateValue: true
      - key: REVIEW_SECONDS
        value: "20"
